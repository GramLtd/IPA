<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok панель</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#6b7280; --accent:#fe2c55; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa0a6; --border:#2a2e36; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  nav { display:flex; gap:20px; padding:14px 20px; background:var(--card); border-bottom:1px solid var(--border); }
  nav a { color:var(--text); text-decoration:none; font-weight:600; }
  nav a:hover { color:var(--accent); }
  main { max-width:1000px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  th { color:var(--muted); font-weight:500; font-size:13px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 16px; font:inherit; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:transparent; color:var(--muted); border:1px solid var(--border); padding:4px 10px; }
  .err { color:#dc2626; }
  .muted { color:var(--muted); font-size:13px; }
  label { display:block; margin:12px 0 4px; font-weight:500; }
  input[type=text],input[type=number],input[type=datetime-local],select,textarea { width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  .check { display:flex; align-items:center; gap:8px; font-weight:400; margin:6px 0; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .avatar { width:32px; height:32px; border-radius:50%; vertical-align:middle; }
  .st-done { color:#16a34a; } .st-failed { color:#dc2626; } .st-processing,.st-uploading { color:#d97706; }
  .table-wrap { overflow-x:auto; }
</style>
</head>
<body>
<nav><a href="/">Аккаунты</a><a href="/upload">Загрузить видео</a><a href="/jobs">Очередь</a></nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
